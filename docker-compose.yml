services:
  postgres_db:
    image: postgres:15-alpine
    container_name: postgres_${CONTAINER_SUFFIX}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
      PGTZ: ${PGTZ}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata_tubagus_098:/var/lib/postgresql/data
    networks:
      - salam_net_098
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin_web:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_${CONTAINER_SUFFIX}
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      TZ: ${TZ}
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_tubagus_098:/var/lib/pgadmin
    networks:
      - salam_net_098
    depends_on:
      postgres_db:
        condition: service_healthy

volumes:
  pgdata_tubagus_098:
  pgadmin_tubagus_098:

networks:
  salam_net_098:
    driver: bridge